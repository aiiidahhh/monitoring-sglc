<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SGLC Deformation Monitoring – 3D Viewer</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
  :root{--ink:#14232b;--paper:#f3f5f2;--line:#cdd5d0;--accent:#1f6f5c}
  *{box-sizing:border-box} html,body{margin:0;height:100%;font:14px/1.45 'IBM Plex Sans',system-ui,sans-serif;color:var(--ink)}
  #map{position:absolute;inset:0}
  #panel{position:absolute;top:12px;left:12px;width:276px;max-height:calc(100% - 24px);overflow:auto;background:var(--paper);
    border:1px solid var(--line);border-radius:6px;padding:14px;box-shadow:0 2px 10px rgba(20,35,43,.18)}
  h1{font-size:16px;margin:0 0 2px} .sub{color:#56666d;margin:0 0 12px;font-size:12.5px}
  h2{font-size:13px;margin:14px 0 6px}
  select,button{font:inherit;width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink)}
  button{cursor:pointer;margin-top:6px} button:hover{border-color:var(--accent)} :focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  label.row{display:flex;align-items:center;gap:8px;margin:4px 0;cursor:pointer}
  .sw{width:16px;height:16px;flex:none} .ct{margin-left:auto;color:#56666d;font-variant-numeric:tabular-nums}
  .pop h3{margin:0 0 4px;font-size:15px} .pop table{border-collapse:collapse} .pop td{padding:1px 10px 1px 0;vertical-align:top}
  .pop td:first-child{color:#56666d}
  #msg{color:#a4262c;font-size:12.5px;margin-top:6px}
  #info{position:absolute;top:12px;right:64px;width:270px;z-index:1000;background:#fff;border:1px solid var(--line);border-radius:6px;
    padding:12px 14px;box-shadow:0 4px 16px rgba(20,35,43,.28)} #info[hidden]{display:none}
  #info h3{margin:0 24px 6px 0;font-size:16px} #info table{border-collapse:collapse;width:100%} #info td{padding:2px 8px 2px 0;vertical-align:top}
  #info img{cursor:zoom-in;display:block;width:100%;max-height:170px;object-fit:cover;border-radius:4px;margin-top:4px}
  #info td:first-child{color:#56666d;white-space:nowrap} #infoClose{position:absolute;top:6px;right:8px;width:24px;height:24px;padding:0;margin:0;border:0;background:none;font-size:18px;line-height:1}
  #lightbox{position:fixed;inset:0;z-index:2000;background:rgba(10,18,22,.92);display:flex;align-items:center;justify-content:center;cursor:zoom-out}
  #lightbox[hidden]{display:none} #lightbox img{max-width:96vw;max-height:94vh;object-fit:contain;border-radius:4px}
  #lbClose{position:absolute;top:12px;right:16px;width:44px;height:44px;margin:0;padding:0;border:0;background:none;color:#fff;font-size:34px;line-height:1;cursor:pointer}
  @media(max-width:560px){#panel{width:auto;right:12px;max-height:42%}}
</style>
</head>
<body>
<div id="map"></div>
<div id="lightbox" hidden><button id="lbClose" aria-label="Tutup foto">×</button><img id="lbImg" alt=""></div>
<div id="info" hidden><button id="infoClose" aria-label="Close">×</button><div id="infoBody"></div></div>
<aside id="panel">
  <h1>SGLC monitoring viewer</h1>
  <p class="sub">Smart Green Learning Center, Faculty of Engineering, UGM</p>
  <p class="sub">Drag: orbit the view · Right-drag or Shift-drag: pan · Scroll: zoom</p>
  <h2>Basemap</h2>
  <select id="basemap" aria-label="Basemap"></select>
  <h2>Points</h2>
  <div id="legend"></div>
  <label class="row"><input type="checkbox" id="lbl" checked>Show 3D labels (PT, GNSS)</label>
  <h2>Model alignment</h2>
  <label class="row">Rotation (°, clockwise)<input id="mRot" type="number" step="0.5" style="width:70px;margin-left:auto"></label>
  <label class="row">Shift east (m)<input id="mE" type="number" step="0.5" style="width:70px;margin-left:auto"></label>
  <label class="row">Shift north (m)<input id="mN" type="number" step="0.5" style="width:70px;margin-left:auto"></label>
  <label class="row">Scale (×)<input id="mS" type="number" step="0.05" style="width:70px;margin-left:auto"></label>
  <div class="sub" id="mOut"></div>
  <h2>Data</h2>
  <button id="csvBtn">Load points from CSV</button>
  <input id="csv" type="file" accept=".csv,text/csv" hidden>
  <button id="reset">Reset view</button>
  <div id="msg" role="status"></div>
</aside>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/three@0.147.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
